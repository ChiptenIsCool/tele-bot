[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Gemini API; skipped automatically when GEMINI_API_KEY is absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["tele_bot", "agents", "tests"]
python_version = "3.11"

# google-adk does not ship type information; its boundary is kept typed by our
# own contracts (HumanPresenceVerdict) which are validated explicitly.
[[tool.mypy.overrides]]
module = ["google.adk.*"]
ignore_missing_imports = true
